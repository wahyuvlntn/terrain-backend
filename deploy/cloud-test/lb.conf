# Round robin over the two API replicas (the GCP load balancer's role).
upstream api_replicas {
    server api1:8080 max_fails=0;
    server api2:8080 max_fails=0;
}
server {
    listen 8080;
    client_max_body_size 100M;
    location / {
        proxy_pass http://api_replicas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Upstream-Replica $upstream_addr;
        add_header X-Served-By $upstream_addr always;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
